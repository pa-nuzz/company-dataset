[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "company-dataset"
version = "0.1.0"
description = "Build a verified dataset of companies using Greenhouse, Lever, or Ashby public job boards"
requires-python = ">=3.11"
dependencies = ["requests>=2.31", "duckdb>=1.1", "langdetect>=1.0.9", "dnspython>=2.6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
company-dataset = "company_dataset.pipeline:main"
company-dataset-legacy = "company_dataset.legacy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
